# Render deploy config for Neural Link
# https://render.com/docs/yaml-spec
services:
  - type: web
    name: neural-link
    runtime: pnpm
    # Build runs from the repo root.
    buildCommand: bash ./scripts/build-render.sh
    # Run the Express API server (which also serves the built frontend in production).
    startCommand: cd artifacts/api-server && node --enable-source-maps ./dist/index.mjs
    plan: free
    # Render injects PORT automatically. Pin Node 22 (stable on free tier).
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: /
      - key: OPENROUTER_API_KEY
        sync: false   # you paste this in the Render dashboard (not committed)
      - key: OPENROUTER_MODEL
        value: google/gemini-2.5-flash
      - key: OPENROUTER_TTS_MODEL
        value: fish-audio/s2.1-pro-free:free
      - key: OPENROUTER_TTS_VOICE
        value: alloy
      - key: SITE_URL
        value: https://neural-link.onrender.com
